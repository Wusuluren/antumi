<style>
#antumi-browser-motion {
  --k-bg: light-dark(#ffffff, #0d0d0d);
  --k-fill: light-dark(#f8f8f8, #171717);
  --k-text: light-dark(#080808, #ffffff);
  --k-muted: light-dark(#666666, #aaaaaa);
  --k-quiet: light-dark(#999999, #6f6f6f);
  --k-border: light-dark(#eeeeee, #262626);
  --k-accent: light-dark(#c2542d, #e0754c);
  --k-done: light-dark(#3b8a4f, #78bd86);
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 14px; line-height: 1.5; color: var(--k-text);
}
#antumi-browser-motion * { box-sizing: border-box; }
#antumi-browser-motion [hidden] { display: none !important; }
#antumi-browser-motion .motion-stage { min-height: 352px; padding: 24px 12px; }
#antumi-browser-motion .conversation { background: var(--k-bg); border: 1px solid var(--k-border); border-radius: 12px; padding: 16px 12px; }
#antumi-browser-motion .tool-row { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 0; }
#antumi-browser-motion .tool-row > span { min-width: 0; }
#antumi-browser-motion .summary { color: var(--k-muted); }
#antumi-browser-motion .name { font-weight: 500; }
#antumi-browser-motion .title { color: var(--k-muted); overflow-wrap: anywhere; }
#antumi-browser-motion .time { margin-left: auto; color: var(--k-quiet); font-size: 12px; white-space: nowrap; }
#antumi-browser-motion .rail { border-left: 1px solid var(--k-border); margin-left: 7px; padding-left: 12px; }
#antumi-browser-motion .mark { display: inline-block; position: relative; width: 16px; height: 16px; flex: 0 0 16px; color: var(--k-quiet); }
#antumi-browser-motion .mark::before { content: ''; position: absolute; inset: 2px 0; border: 1.2px solid currentColor; border-radius: 2px; }
#antumi-browser-motion .mark::after { content: ''; position: absolute; left: 1px; right: 1px; top: 6px; border-top: 1px solid currentColor; }
#antumi-browser-motion .mark .pointer { position: absolute; width: 5px; height: 7px; left: 8px; top: 8px; background: currentColor; clip-path: polygon(0 0, 100% 68%, 58% 68%, 78% 100%, 56% 100%, 37% 72%, 0 100%); }
#antumi-browser-motion .active .mark { color: var(--k-accent); }
#antumi-browser-motion [data-running='true'] .active .mark::before { animation: icon-open 3s ease-in-out infinite; }
#antumi-browser-motion [data-running='true'] .active .pointer { animation: icon-pointer 3s ease-in-out infinite; }
#antumi-browser-motion .mini-browser { width: 248px; max-width: 100%; height: 140px; margin: 8px 0 8px 24px; position: relative; color: var(--k-accent); }
#antumi-browser-motion .browser-window { position: absolute; inset: 0; overflow: hidden; border: 1px solid var(--k-border); border-radius: 8px; background: var(--k-bg); transform-origin: 50% 100%; }
#antumi-browser-motion .browser-chrome { display: flex; align-items: center; gap: 3px; height: 28px; padding: 0 8px; background: var(--k-fill); border-bottom: 1px solid var(--k-border); }
#antumi-browser-motion .window-dot { width: 3px; height: 3px; background: var(--k-quiet); border-radius: 50%; }
#antumi-browser-motion .address { font-size: 11px; margin-left: 8px; color: var(--k-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#antumi-browser-motion .web-page { padding: 12px; }
#antumi-browser-motion .page-label { font-size: 12px; font-weight: 500; color: var(--k-text); margin-bottom: 8px; }
#antumi-browser-motion .page-line { height: 3px; background: var(--k-border); margin: 6px 0; border-radius: 1px; width: 84%; }
#antumi-browser-motion .page-line.short { width: 63%; }
#antumi-browser-motion .page-field { width: 100px; height: 18px; margin-top: 10px; border: 1px solid var(--k-border); border-radius: 3px; position: relative; }
#antumi-browser-motion .typed { position: absolute; left: 6px; top: 7px; height: 2px; width: 36px; background: var(--k-accent); }
#antumi-browser-motion .cursor { position: absolute; left: 82px; top: 70px; width: 12px; height: 16px; background: currentColor; clip-path: polygon(0 0, 100% 68%, 58% 68%, 78% 100%, 56% 100%, 37% 72%, 0 100%); }
#antumi-browser-motion .click-ring { position: absolute; left: 78px; top: 66px; width: 12px; height: 12px; border: 1px solid currentColor; border-radius: 50%; opacity: 0; }
#antumi-browser-motion [data-running='true'] .browser-window { animation: browser-open 6s cubic-bezier(.2,.8,.2,1) infinite; }
#antumi-browser-motion [data-running='true'] .web-page { animation: page-scroll 6s ease-in-out infinite; }
#antumi-browser-motion [data-running='true'] .cursor { animation: browser-cursor 6s ease-in-out infinite; }
#antumi-browser-motion [data-running='true'] .click-ring { animation: browser-click 6s ease-out infinite; }
#antumi-browser-motion [data-running='true'] .typed { animation: browser-type 6s steps(6) infinite; }
#antumi-browser-motion [data-running='false'] .active .mark { color: var(--k-done); }
#antumi-browser-motion [data-running='false'] .cursor { display: none; }
#antumi-browser-motion .caption { display: flex; gap: 8px; align-items: center; margin-left: 24px; font-size: 12px; color: var(--k-muted); min-height: 24px; }
#antumi-browser-motion .status-dot { width: 5px; height: 5px; background: var(--k-accent); border-radius: 50%; }
#antumi-browser-motion [data-running='false'] .status-dot { background: var(--k-done); }
#antumi-browser-motion .preview-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
#antumi-browser-motion button { background: var(--k-bg); color: var(--k-text); border: 1px solid var(--k-border); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 12px; }
#antumi-browser-motion button:hover { background: var(--k-fill); }
@keyframes icon-open { 0%, 100% { transform: scale(.8); opacity: .65; } 16%, 85% { transform: scale(1); opacity: 1; } }
@keyframes icon-pointer { 0%, 15% { opacity: 0; transform: translate(3px, 2px); } 35%, 55% { opacity: 1; transform: translate(-2px, -2px); } 65% { transform: translate(-2px, -2px) scale(.75); } 80%, 100% { opacity: 1; transform: translate(1px, 1px); } }
@keyframes browser-open { 0% { opacity: 0; transform: translateY(8px) scale(.94); } 8%, 96% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(0) scale(1); } }
@keyframes browser-cursor { 0%, 12% { opacity: 0; transform: translate(98px, 28px); } 20% { opacity: 1; transform: translate(54px, 14px); } 40%, 46% { opacity: 1; transform: translate(0, 0); } 49% { transform: scale(.85); } 60%, 78% { opacity: 1; transform: translate(-20px, 33px); } 90%, 100% { opacity: 0; transform: translate(46px, 28px); } }
@keyframes browser-click { 0%, 44% { opacity: 0; transform: scale(.4); } 48% { opacity: .8; transform: scale(1); } 58%, 100% { opacity: 0; transform: scale(2.5); } }
@keyframes browser-type { 0%, 60% { width: 0; } 78%, 100% { width: 36px; } }
@keyframes page-scroll { 0%, 79% { transform: translateY(0); } 88%, 100% { transform: translateY(-12px); } }
@media (max-width: 420px) {
  #antumi-browser-motion .motion-stage { padding: 16px 0; min-height: 390px; }
  #antumi-browser-motion .tool-row { flex-wrap: wrap; }
  #antumi-browser-motion .title { width: 100%; margin-left: 24px; }
  #antumi-browser-motion .mini-browser { width: calc(100% - 24px); }
}
@media (prefers-reduced-motion: reduce) { #antumi-browser-motion *, #antumi-browser-motion *::before { animation: none !important; } }
</style>
<div id="antumi-browser-motion">
  <div class="viz-carousel viz-dotted-background" aria-label="浏览器操作动效方案" data-previous-label="上一方案" data-next-label="下一方案">
    <section class="motion-stage" data-variant="浏览器小窗" data-running="true" aria-label="浏览器小窗动效">
      <div class="conversation">
        <div class="tool-row summary"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span>浏览器操作 4 次</span><span class="time">⌄</span></div>
        <div class="rail">
          <div class="tool-row"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span class="name">Claude in Chrome · Tabs Context</span></div>
          <div class="tool-row active"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span class="name">Claude in Chrome · Navigate</span><span class="time current-time">进行中</span></div>
          <div class="mini-browser" role="img" aria-label="示意动画：浏览器窗口打开，光标移动点击，输入文字，再滚动页面">
            <div class="browser-window">
              <div class="browser-chrome"><span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span><span class="address">chowbus.atlassian.net / wiki</span></div>
              <div class="web-page"><div class="page-label">AI Menu ASK</div><div class="page-line"></div><div class="page-line short"></div><div class="page-field"><span class="typed"></span></div><div class="page-line"></div></div>
            </div>
            <span class="click-ring"></span><span class="cursor"></span>
          </div>
          <div class="caption"><span class="status-dot" aria-hidden="true"></span><span class="phase-text" role="status">正在打开页面…</span></div>
        </div>
      </div>
      <div class="preview-actions"><button type="button" class="cursor-interaction" data-action="replay">重播动效</button><button type="button" class="cursor-interaction" data-action="finish">查看完成态</button></div>
    </section>
    <section class="motion-stage" data-variant="行内图标" data-running="true" aria-label="行内图标动效" hidden>
      <div class="conversation">
        <div class="tool-row summary active"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span>浏览器操作 4 次</span><span class="time">⌄</span></div>
        <div class="rail">
          <div class="tool-row"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span class="name">Claude in Chrome · Tabs Context</span></div>
          <div class="tool-row active"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span class="name">Claude in Chrome · Navigate</span><span class="time current-time">进行中</span></div>
          <div class="tool-row"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span class="name">Claude in Chrome · Get Page Text</span></div>
          <div class="tool-row"><span class="mark" aria-hidden="true"><span class="pointer"></span></span><span class="name">Claude in Chrome · Tabs Close</span></div>
        </div>
      </div>
      <div class="preview-actions"><button type="button" class="cursor-interaction" data-action="replay">重播动效</button><button type="button" class="cursor-interaction" data-action="finish">查看完成态</button></div>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('antumi-browser-motion');
  const stages = [...root.querySelectorAll('.motion-stage')];
  let started = Date.now();
  const phases = ['正在打开页面…', '正在读取页面…', '正在点击页面…', '正在输入内容…', '正在滚动页面…'];
  function render(running) {
    for (const stage of stages) {
      stage.dataset.running = String(running);
      const time = stage.querySelector('.current-time');
      time.textContent = running ? '进行中' : '已完成';
      const phase = stage.querySelector('.phase-text');
      if (phase) phase.textContent = running ? phases[0] : '浏览器操作已完成';
    }
  }
  function restore(state) {
    const running = state?.modelContent?.running;
    render(typeof running === 'boolean' ? running : true);
  }
  root.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    const running = button.dataset.action === 'replay';
    if (running) {
      render(false);
      void root.offsetWidth;
      started = Date.now();
    }
    render(running);
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { running }, privateContent: null }).catch(() => {});
  });
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', (event) => {
    if (event.detail?.globals?.widgetState) restore(event.detail.globals.widgetState);
  });
  const timer = setInterval(() => {
    if (!root.isConnected) { clearInterval(timer); return; }
    const phase = Math.min(4, Math.floor(((Date.now() - started) % 6000) / 1200));
    const label = root.querySelector('.phase-text');
    if (stages[0].dataset.running === 'true') label.textContent = phases[phase];
  }, 600);
  if (globalThis.Tweak) {
    const state = { running: stages[0].dataset.running === 'true' };
    const tweak = new Tweak({ container: root, onChange: () => render(state.running) });
    tweak.addToggle(state, 'running', { label: '播放动效' });
  }
})();
</script>
