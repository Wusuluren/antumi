<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Antumi</title>
  <rect width="1024" height="1024" rx="228" fill="#ffffff"/>

  <!-- glyph drawn off-centre, then centred at 90% -->
  <g transform="translate(512 512) scale(0.9) translate(-520 -472)">

  <g fill="#c2542d" stroke="#c2542d" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs, behind the body -->
    <g fill="none" stroke-width="52">
      <path d="M470 590 L410 780"/>
      <path d="M535 600 L560 790"/>
      <path d="M590 585 Q660 640 690 770"/>
    </g>

    <!-- antennae -->
    <g fill="none" stroke-width="34">
      <path d="M672 318 Q666 220 742 176"/>
      <path d="M736 334 Q776 252 862 250"/>
    </g>
    <circle cx="742" cy="176" r="30" stroke="none"/>
    <circle cx="862" cy="250" r="30" stroke="none"/>
  </g>

  <!-- body parts; the white stroke cuts the gap between overlapping shapes -->
  <g fill="#c2542d" stroke="#ffffff" stroke-width="30" paint-order="stroke">
    <ellipse cx="330" cy="610" rx="178" ry="140" transform="rotate(-14 330 610)"/>
    <circle cx="532" cy="540" r="78"/>
    <circle cx="700" cy="420" r="118"/>
  </g>

  <!-- abdomen stripes as negative space -->
  <g stroke="#ffffff" stroke-width="30" stroke-linecap="round">
    <path d="M300 440 L250 790"/>
    <path d="M384 440 L340 780"/>
  </g>

  <!-- eye -->
  <circle cx="748" cy="400" r="30" fill="#1a0f0a"/>
  <circle cx="758" cy="390" r="9" fill="#ffffff"/>
  </g>
</svg>
