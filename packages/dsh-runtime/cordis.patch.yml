- id: session-title-llm
  disabled: true
- id: hmr
  disabled: true
- id: fs-sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      read-only: { sandbox: read-only, approval: never }
      workspace-write: { sandbox: workspace-write, approval: ask }
      antumi-auto: { sandbox: workspace-write, approval: never }
      danger-full-access: { sandbox: danger-full-access, approval: never }
- insert:
    - id: antumi-filesystem
      name: '@antumi/dsh-runtime/filesystem'
    - id: antumi-shell
      name: '@antumi/dsh-runtime/shell'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000
    - id: antumi-powershell
      name: '@antumi/dsh-runtime/powershell'
      disabled: !!js process.platform !== 'win32'
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'
    - id: antumi-acp
      name: '@antumi/dsh-runtime'
      inject: [acpAppStartup]
